version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: ledgerguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ledgerguard}
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ledgerguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ledgerguard-backend
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://admin:admin@mongo:27017/ledgerguard?authSource=admin
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ledgerguard-frontend
    restart: unless-stopped
    env_file:
      - frontend/.env.example
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
