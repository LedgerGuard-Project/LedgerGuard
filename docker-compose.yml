version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: ledgerguard-mongo
    restart: unless-stopped
    command: [mongod, "--replSet", "rs0", "--bind_ip_all"]
    # LedgerGuard's dev configuration expects the single-node replica set on
    # host port 27018 (see backend/.env MONGO_URI). Phase 2 ACID transactions
    # require replSet rs0.
    ports:
      - "27018:27017"
    # NOTE: no root credentials here on purpose. Local dev connects without
    # auth (backend/.env has no credentials), and TenantConnectionManager
    # builds per-tenant URIs by naive path concatenation, which would break if
    # authSource query params had to be carried through. Enable auth + update
    # both connection paths together when hardening for production.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo-init:
    image: mongo:7
    container_name: ledgerguard-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --eval
      "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27018'}]}) }"

  redis:
    image: redis:7-alpine
    container_name: ledgerguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ledgerguard-backend
    restart: unless-stopped
    env_file:
      - backend/.env.example
    environment:
      NODE_ENV: production
      # directConnection=true: rs0's single member is registered as
      # 'localhost:27018' so host-side dev clients resolve it; a topology-
      # discovering connection from inside this container would be redirected
      # to that unreachable name. Direct mode still supports transactions.
      MONGO_URI: mongodb://mongo:27017/ledgerguard_global?directConnection=true
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ledgerguard-frontend
    restart: unless-stopped
    env_file:
      - frontend/.env.example
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
